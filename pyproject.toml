# Hermes gives dependency-only workspace members a unique name per profile.
# setup.py also supports the standard setuptools fallback for wheel builds.

[project]
name = "hermes-atlas-intelligent-ui"
version = "0.6.0"
description = "Validated generative UI for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hermes-atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]
include-package-data = false

[tool.setuptools.package-data]
atlas = ["catalog.json", "static/**/*", "static/*", "plugin/**/*", "plugin/*"]
