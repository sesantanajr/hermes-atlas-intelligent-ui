# Tooling configuration only.
#
# There is deliberately no [project] table in this file. Hermes reads a [project] table beside
# plugin.yaml as the plugin's Python dependency declaration and would then resolve the shared
# environment every time the plugin is enabled. Atlas needs nothing beyond what Hermes core ships,
# so it declares nothing. The metadata of the optional standalone wheel lives in
# packaging/pyproject.toml and is built with `python scripts/build_wheel.py`.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["node_modules", "dist", "build", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008", "B904", "UP007"]
