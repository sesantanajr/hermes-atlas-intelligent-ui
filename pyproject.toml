[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-atlas-intelligent-ui"
version = "0.1.0"
description = "Validated generative UI for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hermes-atlas = "atlas.server:main"

[tool.setuptools]
packages = ["atlas"]
