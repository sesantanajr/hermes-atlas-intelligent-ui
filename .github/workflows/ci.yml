name: Atlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist dashboard/dist desktop
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir work/wheels .
      - run: python scripts/verify-wheel.py work/wheels
