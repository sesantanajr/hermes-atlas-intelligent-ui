name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Front-end tests
        run: npm test

      - name: Build every interface and check the bundles
        run: npm run build

      - name: Committed bundles match the source
        # `hermes plugins install` clones the repository and builds nothing.
        run: |
          git status --porcelain -- dashboard/dist desktop hermes_atlas/static hermes_atlas/assets hermes_atlas/catalog.json
          git diff --exit-code -- dashboard/dist desktop hermes_atlas/static hermes_atlas/assets hermes_atlas/catalog.json
          test -z "$(git status --porcelain --untracked-files=all -- dashboard/dist desktop hermes_atlas/static hermes_atlas/assets)"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Hermes Agent installs run on Python 3.14; the standalone app accepts 3.11 and newer.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.10,<3" "fastapi>=0.104" "httpx>=0.27" "uvicorn>=0.31" "pytest>=8"

      - name: Tests
        run: python -m pytest

      - name: Standalone wheel
        run: |
          python scripts/build_wheel.py
          python scripts/verify-wheel.py work/wheels

  hermes:
    name: Hermes Agent validates the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_HOME: ${{ github.workspace }}/hermes-home
    steps:
      - uses: actions/checkout@v7
        with:
          path: atlas-intelligent-ui

      - name: Install Hermes Agent
        # The official installer and its latest stable release, as users get it. Hermes refuses to
        # build a wheel outside its own packaging, so `pip install` of its repository fails.
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/install-hermes.sh"
          bash "$RUNNER_TEMP/install-hermes.sh" --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version

      - name: hermes plugins validate
        run: hermes plugins validate ./atlas-intelligent-ui

      - name: hermes plugins doctor
        run: hermes plugins doctor ./atlas-intelligent-ui --ci

      - name: Install, enable and use the plugin as a user does
        # From this checkout, through Hermes's own install path (clone, install scan, publication),
        # then the plugin's terminal commands and Hermes's checks by plugin id.
        run: |
          hermes plugins install "file://$GITHUB_WORKSPACE/atlas-intelligent-ui" </dev/null
          hermes plugins enable atlas-intelligent-ui </dev/null
          hermes plugins list </dev/null | grep -F atlas-intelligent-ui
          test -d "$HERMES_HOME/plugins/atlas-intelligent-ui"
          hermes atlas migrate
          hermes atlas doctor
          hermes atlas status
          hermes plugins doctor atlas-intelligent-ui --ci
