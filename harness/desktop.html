<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas · Desktop harness</title>
    <style>
      /* Desktop-like theme variables (approximations, for looking at Atlas under a host theme). */
      :root {
        --ui-text-primary: #1d1f24;
        --ui-text-secondary: #555b66;
        --ui-text-tertiary: #8a909b;
        --ui-stroke-primary: #d9dce2;
        --ui-stroke-secondary: #e8eaee;
        --ui-accent: #3d63dd;
        --ui-bg-card: #ffffff;
        --ui-bg-secondary: #f4f5f7;
        --ui-bg-tertiary: #eceef2;
        --ui-bg-editor: #fbfbfc;
        --ui-green: #1f8a4c;
        --ui-yellow: #a86b00;
        --ui-red: #c4352b;
        --ui-blue: #2f6fd6;
        --radius: 10px;
        --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: ui-monospace, Consolas, monospace;
        --page: #f7f7f8;
      }
      :root[data-theme="dark"] {
        --ui-text-primary: #e8e9ec;
        --ui-text-secondary: #a8adb7;
        --ui-text-tertiary: #737985;
        --ui-stroke-primary: #2e323a;
        --ui-stroke-secondary: #24272e;
        --ui-accent: #7c9bff;
        --ui-bg-card: #1b1e24;
        --ui-bg-secondary: #16181d;
        --ui-bg-tertiary: #20242b;
        --ui-bg-editor: #121418;
        --ui-green: #4cc17d;
        --ui-yellow: #e0a63a;
        --ui-red: #ef6b61;
        --ui-blue: #6aa2ff;
        --page: #0f1115;
      }
      html, body { margin: 0; height: 100%; background: var(--page); color: var(--ui-text-primary); font-family: var(--font-sans); }
      .desktop { display: grid; grid-template-columns: 180px 1fr; height: 100vh; }
      aside { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-right: 1px solid var(--ui-stroke-primary); background: var(--ui-bg-secondary); }
      aside button { text-align: left; padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      aside button.active, aside button:hover { background: var(--ui-bg-tertiary); }
      aside hr { width: 100%; border: 0; border-top: 1px solid var(--ui-stroke-primary); }
      main { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
      .transcript { flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 24px 20px; box-sizing: border-box; }
      .bubble { margin: 12px 0; line-height: 1.55; }
      .bubble.user { margin-left: auto; max-width: 70%; padding: 10px 14px; border-radius: 14px; background: var(--ui-bg-tertiary); }
      textarea { margin: 0 auto 16px; width: min(760px, calc(100% - 40px)); min-height: 70px; padding: 10px; border: 1px solid var(--ui-stroke-primary); border-radius: var(--radius); background: var(--ui-bg-card); color: inherit; font: inherit; }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 6px; }
      .toasts p { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--ui-text-primary); color: var(--page); font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness/desktop.tsx"></script>
  </body>
</html>
